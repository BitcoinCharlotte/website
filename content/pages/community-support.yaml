body: |
  ## Support Bitcoin Charlotte

  We run completely from volunteers and donations. Every contribution helps us continue hosting events, producing educational content, and growing the Bitcoin community in Charlotte.

  ## Get Involved

  - **Volunteer** — Help organize events, mentor newcomers, or contribute your skills.
  - **Donate** — Support our mission with a Bitcoin donation.
  - **Spread the Word** — Bring a friend to a meetup or share our resources.

  ## Merch

  Rep Bitcoin Charlotte with official gear! Pick up a **Bitcoin Charlotte T-shirt** by Proof of Ink:

  [Shop Bitcoin Charlotte T-shirts](https://proofofink.com/bitcoin-charlotte/)
