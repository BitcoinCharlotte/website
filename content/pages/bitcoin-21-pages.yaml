  ## Bitcoin: Everything in 21 Pages

  Everything you need to know about Bitcoin, condensed into 21 pages. This booklet covers the basics of what Bitcoin is, how it works, why it matters, and how to get started.

  Perfect for newcomers and a great resource to share with friends and family.

