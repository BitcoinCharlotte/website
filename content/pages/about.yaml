body: |
  ## About Bitcoin Charlotte

  Bitcoin Charlotte welcomes everyone interested in Bitcoin, decentralization, privacy and freedom. Make valuable connections with people on the forefront of this world changing technology.

  We host socials, workshops, and online hangouts. Our mission is to spread knowledge to liberate individuals and businesses from financial dependence on banks and governments by leveraging Bitcoin.

  We run Bitcoin meetups and seminars, help businesses accept Bitcoin, and provide free educational resources on Bitcoin.

  **2,647 members strong.**
